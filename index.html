document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;color:#9bb6d2;line-height:1;flex:none;\">04<\u002Fdiv>\n      <div style=\"font-size:33px;font-weight:600;line-height:1.3;\">להבין איפה נכנסים <span style=\"color:#14497e;\">NIPT, מי שפיר, CVS, צ׳יפ ואקסום<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"מקרה פתיחה\" data-screen-label=\"03 · מקרה פתיחה\" data-speaker-notes=\"התשובה איננה מי שפיר מיד. לפי חוזר משרד הבריאות 25/2013, סיכון של 1:2000 הוא סיכון ביניים (1:201 עד 1:3000), ולכן ממשיכים לסקר שליש שני לצורך חישוב משולב — לא ישר לבדיקה חודרנית. נחזור למקרה הזה בשקופית 21.\" style=\"box-sizing:border-box;width:100%;height:100%;background:#ffffff;color:#16202e;font-family:'Assistant',sans-serif;direction:rtl;text-align:right;padding:88px 100px 80px;display:flex;flex-direction:column;\">\n  <div style=\"font-size:24px;font-weight:700;letter-spacing:3px;color:#2f6fb0;margin-bottom:14px;\">מבוא · מקרה לדיון<\u002Fdiv>\n  <h2 style=\"font-size:64px;font-weight:800;line-height:1.05;margin:0;color:#14497e;\">מקרה פתיחה<\u002Fh2>\n  <div style=\"flex:1;display:flex;gap:46px;margin-top:40px;align-items:stretch;\">\n    <div style=\"flex:1.05;background:#eef3f8;border:1px solid #d3e0ee;border-radius:10px;padding:40px 44px;display:flex;flex-direction:column;\">\n      <div style=\"font-size:31px;font-weight:700;color:#14497e;margin-bottom:8px;\">בת 31 · G1P0 · שבוע 12+5<\u002Fdiv>\n      <div style=\"height:1px;background:#cfdcec;margin:18px 0 26px;\"><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px;font-size:31px;\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;\"><span style=\"font-weight:600;white-space:nowrap;\">שקיפות עורפית (NT)<\u002Fspan><span style=\"font-weight:700;color:#2f7d57;white-space:nowrap;\">2.0 מ״מ · תקין<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;\"><span style=\"font-weight:600;white-space:nowrap;\">PAPP-A< div style=\"flex:1;height:34px;background:#eef1f5;border-radius:5px;overflow:hidden;\"><div style=\"width:99%;height:100%;background:#2f7d57;\"><\u002Fdiv><\u002Fdiv><div style=\"flex:none;width:130px;text-align:left;font-size:27px;font-weight:700;color:#216f48;\">&gt;99%<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:24px;background:#f6f8fa;border:1px solid #dde3ea;border-radius:7px;padding:12px 18px;\"><div style=\"flex:none;width:430px;font-size:28px;font-weight:700;\">מי שפיר / CVS<\u002Fdiv><div style=\"flex:1;font-size:26px;font-weight:600;color:#5a6675;\">בדיקות אבחנתיות — נותנות תשובה על הדגימה, לא ׳אחוז גילוי׳ של סקר<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"NIPT\" data-screen-label=\"17 · NIPT\" data-speaker-notes=\"להדגיש: NIPT הוא 'סקר מצוין', לא אבחנה. cfDNA ממקור שלייתי בדם האם, אפשרי משבוע 10, רגיש מאוד ל-T21/T18/T13. תוצאה חריגה מחייבת אישור ב-CVS או מי שפיר. הוא אינו מחליף סקירת מערכות, אינו מזהה מומים מבניים, ואינו מחליף CMA אם יש ממצא US חריג.\" style=\"box-sizing:border-box;width:100%;height:100%;background:#ffffff;color:#16202e;font-family:'Assistant',sans-serif;direction:rtl;text-align:right;padding:88px 100px 80px;display:flex;flex-direction:column;\">\n  <div style=\"font-size:24px;font-weight:700;letter-spacing:3px;color:#2f6fb0;margin-bottom:14px;\">אחוזי גילוי · NIPT<\u002Fdiv>\n  <h2 style=\"font-size:64px;font-weight:800;line-height:1.05;margin:0;color:#14497e;\">NIPT: איפה הוא נכנס?<\u002Fh2>\n  <div style=\"flex:1;display:flex;gap:34px;margin-top:38px;\">\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:16px;\">\n      <div style=\"background:#eef3f8;border:1px solid #d3e0ee;border-radius:8px;padding:22px 28px;font-size:30px;font-weight:600;line-height:1.3;\">בדיקת <strong style=\"color:#14497e;\">cfDNA<\u002Fstrong> ממקור שלייתי בדם האם<\u002Fdiv>\n      <div style=\"background:#eef3f8;border:1px solid #d3e0ee;border-radius:8px;padding:22px 28px;font-size:30px;font-weight:600;\">אפשרית כבר <strong style=\"color:#14497e;\">משבוע 10<\u002Fstrong><\u002Fdiv>\n      <div style=\"background:#eef3f8;border:1px solid #d3e0ee;border-radius:8px;padding:22px 28px;font-size:30px;font-weight:600;\">רגישה מאוד ל-<strong style=\"color:#14497e;\">T21, T18, T13<\u002Fstrong><\u002Fdiv>\n      <div style=\"background:#e7f1ec;border:1px solid #b9d8c6;border-radius:8px;padding:22px 28px;font-size:30px;font-weight:700;color:#216f48;\">סקר מצוין — אך אינו אבחנתי<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;background:#f6f8fa;border:1px solid #dde3ea;border-radius:12px;padding:34px 36px;display:flex;flex-direction:column;gap:20px;justify-content:center;\">\n      <div style=\"font-size:29px;font-weight:700;color:#b23b34;letter-spacing:1px;\">מה NIPT לא עושה<\u002Fdiv>\n      <div style=\"font-size:29px;font-weight:600;line-height:1.3;\">תוצאה חריגה <strong>מחייבת אישור<\u002Fstrong> ב-CVS או מי שפיר<\u002Fdiv>\n      <div style=\"font-size:29px;font-weight:600;line-height:1.3;\">אינו מחליף סקירת מערכות ואינו מזהה מומים מבניים<\u002Fdiv>\n      <div style=\"font-size:29px;font-weight:600;line-height:1.3;\">אינו מחליף CMA / מי שפיר כשיש ממצא US חריג או צורך באבחון רחב<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"מתי NIPT לא מספיק\" data-screen-label=\"18 · מגבלות NIPT\" data-speaker-notes=\"מקור ה-cfDNA הוא שלייתי — ולכן תיתכן מוזאיקה שלייתית או תוצאות false positive / false negative. במצבים האלה נעדיף בדיקה אבחנתית שנותנת תשובה על העובר עצמו ולא רק על השליה.\" style=\"box-sizing:border-box;width:100%;height:100%;background:#ffffff;color:#16202e;font-family:'Assistant',sans-serif;direction:rtl;text-align:right;padding:88px 100px 80px;display:flex;flex-direction:column;\">\n  <div style=\"font-size:24px;font-weight:700;letter-spacing:3px;color:#2f6fb0;margin-bottom:14px;\">אחוזי גילוי · NIPT<\u002Fdiv>\n  <h2 style=\"font-size:64px;font-weight:800;line-height:1.05;margin:0;color:#14497e;\">מתי NIPT לא מספיק?<\u002Fh2>\n  <div style=\"font-size:30px;color:#5a6675;margin-top:12px;\">מצבים שבהם נעדיף <strong style=\"color:#16202e;\">בדיקה אבחנתית<\u002Fstrong>:<\u002Fdiv>\n  <div style=\"flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:18px 24px;margin-top:26px;\">\n    <div style=\"background:#eef3f8;border:1px solid #d3e0ee;border-radius:8px;padding:22px 30px;display:flex;align-items:center;font-size:30px;font-weight:600;line-height:1.3;\">ממצא מבני חריג באולטרסאונד<\u002Fdiv>\n    <div style=\"background:#eef3f8;border:1px solid #d3e0ee;border-radius:8px;padding:22px 30px;display:flex;align-items:center;font-size:30px;font-weight:600;line-height:1.3;\">NT מוגבר משמעותית<\u002Fdiv>\n    <div style=\"background:#eef3f8;border:1px solid #d3e0ee;border-radius:8px;padding:22px 30px;display:flex;align-items:center;font-size:30px;font-weight:600;line-height:1.3;\">סקר ביוכימי בסיכון גבוה<\u002Fdiv>\n    <div style=\"background:#eef3f8;border:1px solid #d3e0ee;border-radius:8px;padding:22px 30px;display:flex;align-items:center;font-size:30px;font-weight:600;line-height:1.3;\">רצון המטופלת באבחון ודאי ורחב<\u002Fdiv>\n    <div style=\"background:#eef3f8;border:1px solid #d3e0ee;border-radius:8px;padding:22px 30px;display:flex;align-items:center;font-size:30px;font-weight:600;line-height:1.3;\">סיפור משפחתי / נשאות / חשד לתסמונת<\u002Fdiv>\n    <div style=\"background:#f8ece9;border:1px solid #e6c4bd;border-radius:8px;padding:22px 30px;display:flex;align-items:center;font-size:30px;font-weight:700;color:#b23b34;line-height:1.3;\">תוצאת NIPT חריגה<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"CVS מול מי שפיר\" data-screen-label=\"19 · CVS vs אמניו\" data-speaker-notes=\"המצגות הישנות ציינו סיכון להפלה של 0.5% לאחר מי שפיר. כיום באתר משרד הבריאות מצוין טווח נמוך יותר: 1:400 עד 1:1000. המנחה ביקש להציג סיכון ריאלי של כ-1:1000. CVS עשוי להיות מעט גבוה יותר או דומה — תלוי מקור וניסיון המבצע. confined placental mosaicism ב-CVS עלול לדרוש אימות במי שפיר.\" style=\"box-sizing:border-box;width:100%;height:100%;background:#ffffff;color:#16202e;font-family:'Assistant',sans-serif;direction:rtl;text-align:right;padding:80px 100px 72px;display:flex;flex-direction:column;\">\n  <div style=\"font-size:24px;font-weight:700;letter-spacing:3px;color:#2f6fb0;margin-bottom:12px;\">בדיקות אבחנתיות<\u002Fdiv>\n  <h2 style=\"font-size:60px;font-weight:800;line-height:1.04;margin:0;color:#14497e;\">מי שפיר מול סיסי שליה (CVS)<\u002Fh2>\n  <div style=\"flex:1;display:flex;gap:28px;margin-top:28px;\">\n    <div style=\"flex:1;display:flex;flex-direction:column;border:1px solid #d3e0ee;border-radius:10px;overflow:hidden;\">\n      <div style=\"background:#2f6fb0;color:#fff;padding:22px 30px;font-size:34px;font-weight:800;\">סיסי שליה (CVS)<\u002Fdiv>\n      <div style=\"flex:1;padding:26px 30px;display:flex;flex-direction:column;gap:18px;background:#f8fbff;\">\n        <div style=\"font-size:29px;font-weight:600;\"><span style=\"color:#5a6675;font-weight:700;\">עיתוי:<\u002Fspan> שבוע 10–13 (שליש ראשון)<\u002Fdiv>\n        <div style=\"font-size:29px;font-weight:600;\"><span style=\"color:#5a6675;font-weight:700;\">דגימה:<\u002Fspan> רקמה שלייתית<\u002Fdiv>\n        <div style=\"font-size:29px;font-weight:600;\"><span style=\"color:#5a6675;font-weight:700;\">בדיקות:<\u002Fspan> CMA · קריוטיפ · FISH<\u002Fdiv>\n        <div style=\"font-size:29px;font-weight:600;color:#b07d28;\"><span style=\"color:#5a6675;font-weight:700;\">מגבלה:<\u002Fspan> confined placental mosaicism — עלול לדרוש אימות<\u002Fdiv>\n        <div style=\"font-size:29px;font-weight:600;\"><span style=\"color:#5a6675;font-weight:700;\">סיכון:<\u002Fspan> מעט גבוה יותר או דומה למי שפיר, תלוי מקור וניסיון<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;border:1px solid #d3e0ee;border-radius:10px;overflow:hidden;\">\n      <div style=\"background:#14497e;color:#fff;padding:22px 30px;font-size:34px;font-weight:800;\">מי שפיר<\u002Fdiv>\n      <div style=\"flex:1;padding:26px 30px;display:flex;flex-direction:column;gap:18px;background:#f8fbff;\">\n        <div style=\"font-size:29px;font-weight:600;\"><span style=\"color:#5a6675;font-weight:700;\">עיתוי:<\u002Fspan> משבוע 16<\u002Fdiv>\n        <div style=\"font-size:29px;font-weight:600;\"><span style=\"color:#5a6675;font-weight:700;\">דגימה:<\u002Fspan> תאים עובריים ממי השפיר<\u002Fdiv>\n        <div style=\"font-size:29px;font-weight:600;\"><span style=\"color:#5a6675;font-weight:700;\">בדיקות:<\u002Fspan> CMA · קריוטיפ · FISH/QF-PCR · אקסום<\u002Fdiv>\n        <div style=\"font-size:29px;font-weight:600;color:#2f7d57;\"><span style=\"color:#5a6675;font-weight:700;\">יתרון:<\u002Fspan> תאים עובריים — תשובה ישירה על העובר<\u002Fdiv>\n        <div style=\"font-size:29px;font-weight:600;\"><span style=\"color:#5a6675;font-weight:700;\">סיכון:<\u002Fspan> <span style=\"color:#b07d28;font-weight:700;\">1:400–1:1000<\u002Fspan> להפלה (כיום ~1:1000 לפי משרד הבריאות)<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"הרצף הגנטי\" data-screen-label=\"20 · הרצף הגנטי\" data-speaker-notes=\"ככל שעולים ברזולוציה, מקבלים יותר מידע — אך גם יותר VUS (Variants of Unknown Significance) ותוצאות שקשה לפרש. CMA הוא כיום הבדיקה המרכזית על דגימות מי שפיר / CVS. אקסום מתאים כשיש מומים מבניים או חשד למחלה מונוגנית, לרוב אחרי CMA תקין ולפי ייעוץ גנטי.\" style=\"box-sizing:border-box;width:100%;height:100%;background:#ffffff;color:#16202e;font-family:'Assistant',sans-serif;direction:rtl;text-align:right;padding:80px 100px 72px;display:flex;flex-direction:column;\">\n  <div style=\"font-size:24px;font-weight:700;letter-spacing:3px;color:#2f6fb0;margin-bottom:12px;\">בדיקות אבחנתיות<\u002Fdiv>\n  <h2 style=\"font-size:60px;font-weight:800;line-height:1.04;margin:0;color:#14497e;\">הרצף הגנטי האבחנתי<\u002Fh2>\n  <div style=\"font-size:28px;color:#5a6675;margin-top:10px;\">דגימה: CVS או מי שפיר<\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:stretch;gap:16px;margin-top:24px;\">\n    <div style=\"flex:1;background:#eef3f8;border:1px solid #d3e0ee;border-radius:10px;padding:26px 28px;display:flex;flex-direction:column;gap:12px;\">\n      <div style=\"font-size:32px;font-weight:800;color:#2f6fb0;\">QF-PCR / FISH<\u002Fdiv>\n      <div style=\"font-size:26px;color:#5a6675;font-weight:600;\">תשובה מהירה<\u002Fdiv>\n      <div style=\"flex:1;font-size:28px;font-weight:600;line-height:1.4;\">T21 · T18 · T13 · כרומוזומי מין<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:none;display:flex;align-items:center;\"><div style=\"font-size:36px;color:#cfd8e3;font-weight:800;\">‹<\u002Fdiv><\u002Fdiv>\n    <div style=\"flex:1;background:#e4edf6;border:1px solid #c5d4e6;border-radius:10px;padding:26px 28px;display:flex;flex-direction:column;gap:12px;\">\n      <div style=\"font-size:32px;font-weight:800;color:#1d5fa8;\">קריוטיפ<\u002Fdiv>\n      <div style=\"font-size:26px;color:#5a6675;font-weight:600;\">רזולוציה בינונית<\u002Fdiv>\n      <div style=\"flex:1;font-size:28px;font-weight:600;line-height:1.4;\">מספר ומבנה כרומוזומים · טרנסלוקציות גדולות<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:none;display:flex;align-items:center;\"><div style=\"font-size:36px;color:#cfd8e3;font-weight:800;\">‹<\u002Fdiv><\u002Fdiv>\n    <div style=\"flex:1;background:#dae4f2;border:1px solid #b4c9e2;border-radius:10px;padding:26px 28px;display:flex;flex-direction:column;gap:12px;\">\n      <div style=\"font-size:32px;font-weight:800;color:#14497e;\">CMA — צ׳יפ<\u002Fdiv>\n      <div style=\"font-size:26px;color:#5a6675;font-weight:600;\">רזולוציה גבוהה · בדיקה מרכזית<\u002Fdiv>\n      <div style=\"flex:1;font-size:28px;font-weight:600;line-height:1.4;\">CNV · חסרים והכפלות תת-מיקרוסקופיים · אנאופלואידיות<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:none;display:flex;align-items:center;\"><div style=\"font-size:36px;color:#cfd8e3;font-weight:800;\">‹<\u002Fdiv><\u002Fdiv>\n    <div style=\"flex:1;background:#0f3760;color:#ffffff;border-radius:10px;padding:26px 28px;display:flex;flex-direction:column;gap:12px;\">\n      <div style=\"font-size:32px;font-weight:800;\">אקסום (WES)<\u002Fdiv>\n      <div style=\"font-size:26px;color:#9cc3e8;font-weight:600;\">רזולוציה מרבית · לפי אינדיקציה<\u002Fdiv>\n      <div style=\"flex:1;font-size:28px;font-weight:600;line-height:1.4;color:#cfe0f1;\">מומים מבניים / חשד למחלה מונוגנית / אחרי CMA תקין<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:18px;font-size:27px;font-weight:600;color:#5a6675;text-align:center;\">עליה ברזולוציה = יותר מידע + יותר VUS<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"חזרה למקרה\" data-screen-label=\"21 · חזרה למקרה\" data-speaker-notes=\"זה החלק שמדגים איך עוברים מנתון מספרי להחלטה קלינית. 1:2000 = סיכון ביניים = ממשיכים לסקר שליש שני. אם לאחר החישוב המשולב הסיכון ≥1:380 — ייעוץ גנטי ובדיקה חודרנית. אם AFP גבוה בפני עצמו (למשל 2.8 MoM) — US מכוון + ייעוץ גנטי, גם אם הסיכון לתסמונת דאון נמוך.\" style=\"box-sizing:border-box;width:100%;height:100%;background:#ffffff;color:#16202e;font-family:'Assistant',sans-serif;direction:rtl;text-align:right;padding:80px 100px 72px;display:flex;flex-direction:column;\">\n  <div style=\"font-size:24px;font-weight:700;letter-spacing:3px;color:#2f6fb0;margin-bottom:12px;\">סיכום · חזרה למקרה<\u002Fdiv>\n  <h2 style=\"font-size:60px;font-weight:800;line-height:1.04;margin:0;color:#14497e;\">חזרה למקרה: בת 31, סיכון 1:2000<\u002Fh2>\n  <div style=\"flex:1;display:flex;gap:36px;margin-top:26px;align-items:stretch;\">\n    <div style=\"flex:0.9;background:#eef3f8;border:1px solid #d3e0ee;border-radius:10px;padding:34px 36px;display:flex;flex-direction:column;gap:14px;\">\n      <div style=\"font-size:30px;font-weight:700;color:#14497e;\">מה עושים?<\u002Fdiv>\n      <div data-reveal=\"q21\" style=\"cursor:pointer;background:#14497e;color:#fff;border-radius:8px;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;font-size:27px;font-weight:700;\">\n        <span data-reveal-hint=\"\">הצגת תשובה<\u002Fspan>\n        <span style=\"font-size:23px;font-weight:600;color:#9cc3e8;\">לחצו לחשיפה<\u002Fspan>\n      <\u002Fdiv>\n      <div data-answer=\"q21\" style=\"display:none;background:#f6f8fa;border-radius:8px;padding:22px 26px;font-size:27px;font-weight:600;line-height:1.4;color:#16202e;\">\n        1:2000 = <strong style=\"color:#b07d28;\">סיכון ביניים<\u002Fstrong> — <strong>לא<\u002Fstrong> בדיקה חודרנית מיד. ממשיכים ל<strong style=\"color:#14497e;\">סקר שליש שני<\u002Fstrong> + חישוב משולב.\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1.1;display:flex;flex-direction:column;gap:14px;\">\n      <div style=\"font-size:29px;font-weight:700;color:#14497e;\">לאחר סקר שליש שני:<\u002Fdiv>\n      <div style=\"background:#f8ece9;border:1px solid #e6c4bd;border-radius:8px;padding:18px 24px;font-size:28px;font-weight:600;line-height:1.3;\"><strong style=\"color:#b23b34;\">סיכון משולב ≥ 1:380<\u002Fstrong> — ייעוץ גנטי + בדיקה חודרנית (CVS / מי שפיר)<\u002Fdiv>\n      <div style=\"background:#e7f1ec;border:1px solid #b9d8c6;border-radius:8px;padding:18px 24px;font-size:28px;font-weight:600;line-height:1.3;\"><strong style=\"color:#216f48;\">סיכון משולב &lt; 1:380<\u002Fstrong> — אין המלצה שגרתית לבדיקה חודרנית<\u002Fdiv>\n      <div style=\"background:#f7f0e1;border:1px solid #e3d2a8;border-radius:8px;padding:18px 24px;font-size:28px;font-weight:600;line-height:1.3;\"><strong style=\"color:#b07d28;\">AFP ≥ 2.5 MoM בפני עצמו<\u002Fstrong> — US מכוון + ייעוץ גנטי, בלי קשר לסיכון לדאון<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"ייעוץ למטופלת\" data-screen-label=\"22 · ייעוץ למטופלת\" data-speaker-notes=\"להדגיש shared decision making. המטופלת חייבת לקבל את ההחלטה מתוך הבנה. תפקידנו להסביר מה המספר אומר — לא להחליט עבורה. כל האמירות האלה הן אמת: גם שסיכון גבוה לא אומר וודאות, וגם שסיכון נמוך לא אומר אפס.\" style=\"box-sizing:border-box;width:100%;height:100%;background:#f6f8fa;color:#16202e;font-family:'Assistant',sans-serif;direction:rtl;text-align:right;padding:80px 100px 72px;display:flex;flex-direction:column;\">\n  <div style=\"font-size:24px;font-weight:700;letter-spacing:3px;color:#2f6fb0;margin-bottom:12px;\">סיכום · shared decision making<\u002Fdiv>\n  <h2 style=\"font-size:60px;font-weight:800;line-height:1.04;margin:0;color:#14497e;\">איך מסבירים למטופלת?<\u002Fh2>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;margin-top:24px;\">\n    <div style=\"background:#fff;border-right:6px solid #2f6fb0;border:1px solid #dde3ea;border-radius:8px;padding:24px 32px;font-size:30px;font-weight:600;line-height:1.35;\">״זו בדיקת סקר — לא אבחנה.״<\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:24px 32px;font-size:30px;font-weight:600;line-height:1.35;\">״סיכון של 1:2000 אומר שמתוך 2000 נשים עם תוצאה דומה, בממוצע אחת תלד עובר עם תסמונת דאון.״<\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:24px 32px;font-size:30px;font-weight:600;line-height:1.35;\">״תוצאה בסיכון גבוה לא אומרת שיש בוודאות בעיה.״<\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:24px 32px;font-size:30px;font-weight:600;line-height:1.35;\">״תוצאה בסיכון נמוך לא מורידה את הסיכון לאפס.״<\u002Fdiv>\n    <div style=\"background:#eef3f8;border:1px solid #d3e0ee;border-radius:8px;padding:24px 32px;font-size:30px;font-weight:600;line-height:1.35;\">״המשך הבירור תלוי בסיכון, בשבוע ההריון, בממצאי US ובהעדפות שלך.״<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Take-Home Messages\" data-screen-label=\"23 · Take-Home Messages\" data-speaker-notes=\"חמשת המסרים המרכזיים לסיום. הדגישו את מסר 2 (רף 1:200 בישראל), מסר 3 (ביניים ממשיך לשני), ומסר 5 (NIPT מעולה כסקר אבל אבחנה = CVS/מי שפיר + CMA).\" style=\"box-sizing:border-box;width:100%;height:100%;background:#14497e;color:#ffffff;font-family:'Assistant',sans-serif;direction:rtl;text-align:right;padding:80px 100px 72px;display:flex;flex-direction:column;\">\n  <div style=\"font-size:24px;font-weight:700;letter-spacing:3px;color:#9cc3e8;margin-bottom:12px;\">סיכום<\u002Fdiv>\n  <h2 style=\"font-size:60px;font-weight:800;line-height:1.04;margin:0;color:#fff;\">Take-Home Messages<\u002Fh2>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;margin-top:24px;\">\n    <div style=\"display:flex;gap:26px;align-items:center;background:rgba(255,255,255,.08);border-radius:10px;padding:20px 28px;\"><div style=\"font-size:44px;font-weight:800;color:#5d9bd6;flex:none;width:60px;\">1<\u002Fdiv><div style=\"font-size:30px;font-weight:600;line-height:1.3;\">Screening בהריון הוא <strong style=\"color:#9cc3e8;\">ניהול סיכון<\u002Fstrong>, לא אבחנה<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:26px;align-items:center;background:rgba(255,255,255,.1);border-radius:10px;padding:20px 28px;border-right:5px solid #9cc3e8;\"><div style=\"font-size:44px;font-weight:800;color:#5d9bd6;flex:none;width:60px;\">2<\u002Fdiv><div style=\"font-size:30px;font-weight:600;line-height:1.3;\">בישראל — הרף בסקר שליש ראשון הוא <strong style=\"color:#fff;font-size:36px;\">1:200<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:26px;align-items:center;background:rgba(255,255,255,.08);border-radius:10px;padding:20px 28px;\"><div style=\"font-size:44px;font-weight:800;color:#5d9bd6;flex:none;width:60px;\">3<\u002Fdiv><div style=\"font-size:30px;font-weight:600;line-height:1.3;\">סיכון ביניים בסקר ראשון → <strong style=\"color:#9cc3e8;\">סקר שליש שני + חישוב משולב<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:26px;align-items:center;background:rgba(255,255,255,.08);border-radius:10px;padding:20px 28px;\"><div style=\"font-size:44px;font-weight:800;color:#5d9bd6;flex:none;width:60px;\">4<\u002Fdiv><div style=\"font-size:30px;font-weight:600;line-height:1.3;\"><strong style=\"color:#9cc3e8;\">NT ≥ 3 מ״מ<\u002Fstrong> ו-<strong style=\"color:#9cc3e8;\">AFP ≥ 2.5 MoM<\u002Fstrong> — דורשים התייחסות עצמאית<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:26px;align-items:center;background:rgba(255,255,255,.08);border-radius:10px;padding:20px 28px;\"><div style=\"font-size:44px;font-weight:800;color:#5d9bd6;flex:none;width:60px;\">5<\u002Fdiv><div style=\"font-size:30px;font-weight:600;line-height:1.3;\">NIPT מצוין כסקר — אבחנה דורשת <strong style=\"color:#9cc3e8;\">CVS / מי שפיר + CMA<\u002Fstrong> לפי אינדיקציה<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"אלגוריתם מסכם\" data-screen-label=\"24 · אלגוריתם\" data-speaker-notes=\"שקופית סיכום ויזואלית. האלגוריתם שמסכם את כל הסמינר. ניתן להשאיר על המסך לדיון בסוף.\" style=\"box-sizing:border-box;width:100%;height:100%;background:#ffffff;color:#16202e;font-family:'Assistant',sans-serif;direction:rtl;text-align:right;padding:64px 80px 56px;display:flex;flex-direction:column;\">\n  <div style=\"font-size:24px;font-weight:700;letter-spacing:3px;color:#2f6fb0;margin-bottom:8px;\">אלגוריתם מסכם<\u002Fdiv>\n  <h2 style=\"font-size:52px;font-weight:800;line-height:1.04;margin:0;color:#14497e;\">ניהול תוצאות הסקר: שקופית אחת<\u002Fh2>\n  <div style=\"flex:1;display:flex;flex-direction:column;align-items:stretch;gap:0;margin-top:18px;\">\n    <div style=\"display:flex;justify-content:center;\"><div style=\"background:#14497e;color:#fff;border-radius:8px;padding:14px 40px;font-size:28px;font-weight:800;\">סקר שליש ראשון<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;justify-content:center;padding:8px 0;\"><div style=\"width:2px;height:22px;background:#c0cad5;\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:18px;align-items:flex-start;\">\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:10px;align-items:center;\">\n        <div style=\"background:#f8ece9;border:2px solid #e6c4bd;border-radius:8px;padding:12px 18px;font-size:25px;font-weight:800;color:#b23b34;text-align:center;width:100%;\">≥ 1:200 <br><span style=\"font-size:22px;font-weight:700;color:#9c4339;\">או NT ≥ 3 מ״מ<\u002Fspan><\u002Fdiv>\n        <div style=\"width:2px;height:16px;background:#e6c4bd;\"><\u002Fdiv>\n        <div style=\"background:#b23b34;color:#fff;border-radius:8px;padding:12px 14px;font-size:24px;font-weight:700;text-align:center;width:100%;line-height:1.3;\">ייעוץ גנטי + CVS / מי שפיר<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1.2;display:flex;flex-direction:column;gap:10px;align-items:center;\">\n        <div style=\"background:#f7f0e1;border:2px solid #e3d2a8;border-radius:8px;padding:12px 18px;font-size:25px;font-weight:800;color:#b07d28;text-align:center;width:100%;\">1:201 – 1:3000 <br><span style=\"font-size:22px;font-weight:600;\">סיכון ביניים<\u002Fspan><\u002Fdiv>\n        <div style=\"width:2px;height:16px;background:#e3d2a8;\"><\u002Fdiv>\n        <div style=\"background:#eef3f8;border:1px solid #d3e0ee;border-radius:8px;padding:12px 14px;font-size:24px;font-weight:700;text-align:center;color:#14497e;width:100%;\">סקר שליש שני + חישוב משולב<\u002Fdiv>\n        <div style=\"width:2px;height:14px;background:#c0cad5;\"><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;width:100%;\">\n          <div style=\"flex:1;background:#f8ece9;border:1px solid #e6c4bd;border-radius:7px;padding:10px;font-size:22px;font-weight:700;text-align:center;color:#b23b34;line-height:1.3;\">≥1:380<br><span style=\"font-size:20px;font-weight:600;\">ייעוץ + חודרנית<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:1;background:#e7f1ec;border:1px solid #b9d8c6;border-radius:7px;padding:10px;font-size:22px;font-weight:700;text-align:center;color:#216f48;line-height:1.3;\">&lt;1:380<br><span style=\"font-size:20px;font-weight:600;\">מעקב רגיל<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:10px;align-items:center;\">\n        <div style=\"background:#e7f1ec;border:2px solid #b9d8c6;border-radius:8px;padding:12px 18px;font-size:25px;font-weight:800;color:#2f7d57;text-align:center;width:100%;\">נמוך מ-1:3000<\u002Fdiv>\n        <div style=\"width:2px;height:16px;background:#b9d8c6;\"><\u002Fdiv>\n        <div style=\"background:#2f7d57;color:#fff;border-radius:8px;padding:12px 14px;font-size:24px;font-weight:700;text-align:center;width:100%;line-height:1.3;\">AFP לסקר מומים פתוחים<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:18px;background:#f0f3f8;border:1px solid #d0d8e6;border-radius:8px;padding:14px 26px;display:flex;align-items:center;gap:16px;\">\n      <div style=\"font-size:26px;font-weight:800;color:#14497e;white-space:nowrap;\">בכל שלב:<\u002Fdiv>\n      <div style=\"font-size:26px;font-weight:600;color:#16202e;\">ממצא US חריג · NIPT חריג · NT ≥ 3 מ״מ ← <strong style=\"color:#b23b34;\">ייעוץ גנטי + בדיקה אבחנתית<\u002Fstrong><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;revealAll&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount(){\n    this._h = (e) => {\n      const t = e.target.closest && e.target.closest('[data-reveal]');\n      if(!t) return;\n      const id = t.getAttribute('data-reveal');\n      const ans = document.querySelector('[data-answer=\"'+id+'\"]');\n      if(!ans) return;\n      const open = ans.getAttribute('data-open') === '1';\n      ans.setAttribute('data-open', open ? '0' : '1');\n      ans.style.display = open ? 'none' : '';\n      const hint = t.querySelector('[data-reveal-hint]');\n      if(hint) hint.textContent = open ? 'הצגת תשובה' : 'הסתרת תשובה';\n    };\n    document.addEventListener('click', this._h, true);\n    this.applyAll();\n  }\n  componentDidUpdate(){ this.applyAll(); }\n  applyAll(){\n    if(this.props.revealAll){\n      document.querySelectorAll('[data-answer]').forEach(a => { a.style.display=''; a.setAttribute('data-open','1'); });\n    }\n  }\n  componentWillUnmount(){ document.removeEventListener('click', this._h, true); }\n  renderVals(){ return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
