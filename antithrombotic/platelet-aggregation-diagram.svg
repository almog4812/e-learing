<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">תרופות המעכבות אגרגציית טסיות</title>
  <desc id="desc">מסלולי שפעול הטסית ואתרי הפעולה של תרופות נוגדות טסיות</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#55758c"/></marker>
    <style>
      text{font-family:Arial,'Noto Sans Hebrew',sans-serif;fill:#193a55}
      .t{font-size:30px;font-weight:700}.sub{font-size:18px}.h{font-size:18px;font-weight:700}.s{font-size:15px}
      .blue{fill:#eef7fc;stroke:#8db8d4;stroke-width:2}.drug{fill:#fff2e9;stroke:#eaa174;stroke-width:2}
      .panel{fill:#f5faf4;stroke:#a9c8a8;stroke-width:2}.line{fill:none;stroke:#55758c;stroke-width:3;marker-end:url(#arrow)}
      .inhib{stroke:#d85c3b;stroke-width:4}.red{fill:#d85c3b}.legend{font-size:15px}
    </style>
  </defs>
  <rect width="1200" height="900" fill="#fff"/>
  <text class="t" x="600" y="42" text-anchor="middle" direction="rtl">תרופות המעכבות אגרגציית טסיות</text>
  <text class="sub" x="600" y="70" text-anchor="middle" direction="rtl">אתרי הפעולה והמסלולים בטסית</text>

  <!-- ADP / P2Y12 -->
  <rect class="blue" x="55" y="110" width="275" height="55" rx="10"/><text class="h" x="192" y="145" text-anchor="middle">ADP</text>
  <rect class="drug" x="55" y="190" width="275" height="78" rx="10"/><text class="s" x="192" y="220" text-anchor="middle">Clopidogrel · Prasugrel</text><text class="s" x="192" y="246" text-anchor="middle">Ticagrelor · Cangrelor</text>
  <line class="inhib" x1="192" y1="268" x2="192" y2="287"/><line class="inhib" x1="180" y1="287" x2="204" y2="287"/>
  <rect class="blue" x="55" y="300" width="275" height="80" rx="10"/><text class="h" x="192" y="330" text-anchor="middle">P2Y12</text><text class="s" x="192" y="357" text-anchor="middle" direction="rtl">קולטן על פני הטסית</text>
  <path class="line" d="M192 165 V180 H350 V325"/>

  <!-- Thrombin / PAR-1 -->
  <rect class="blue" x="425" y="110" width="275" height="55" rx="10"/><text class="h" x="562" y="145" text-anchor="middle" direction="rtl">Thrombin</text>
  <rect class="drug" x="425" y="190" width="275" height="78" rx="10"/><text class="h" x="562" y="236" text-anchor="middle">Vorapaxar</text>
  <line class="inhib" x1="562" y1="268" x2="562" y2="287"/><line class="inhib" x1="550" y1="287" x2="574" y2="287"/>
  <rect class="blue" x="425" y="300" width="275" height="80" rx="10"/><text class="h" x="562" y="330" text-anchor="middle">PAR-1</text><text class="s" x="562" y="357" text-anchor="middle" direction="rtl">קולטן על פני הטסית</text>
  <path class="line" d="M562 165 V180 H720 V325"/>

  <!-- Arachidonic acid / Aspirin -->
  <rect class="panel" x="790" y="90" width="355" height="405" rx="14"/>
  <text class="h" x="967" y="122" text-anchor="middle" direction="rtl">בתוך הטסית</text>
  <rect class="blue" x="840" y="145" width="255" height="55" rx="10"/><text class="h" x="967" y="180" text-anchor="middle" direction="rtl">חומצה ארכידונית</text>
  <rect class="drug" x="800" y="222" width="155" height="55" rx="10"/><text class="h" x="877" y="257" text-anchor="middle">Aspirin</text>
  <text class="s red" x="1060" y="253" text-anchor="middle" direction="rtl">עיכוב בלתי הפיך</text>
  <line class="inhib" x1="877" y1="277" x2="877" y2="298"/><line class="inhib" x1="865" y1="298" x2="889" y2="298"/>
  <rect class="blue" x="840" y="310" width="255" height="55" rx="10"/><text class="h" x="967" y="345" text-anchor="middle">COX-1</text>
  <path class="line" d="M967 200 V305"/>
  <rect class="blue" x="840" y="395" width="255" height="55" rx="10"/><text class="h" x="967" y="430" text-anchor="middle">Thromboxane A₂</text>
  <path class="line" d="M967 365 V390"/>
  <rect class="blue" x="840" y="520" width="255" height="72" rx="10"/><text class="s" x="967" y="550" text-anchor="middle" direction="rtl">קולטן ל-Thromboxane</text><text class="s" x="967" y="574" text-anchor="middle" direction="rtl">על פני הטסית</text>
  <path class="line" d="M967 450 V515"/>

  <!-- Intracellular cAMP -->
  <rect class="panel" x="55" y="415" width="665" height="185" rx="14"/>
  <text class="h" x="585" y="445" text-anchor="middle" direction="rtl">בתוך הטסית</text>
  <rect class="drug" x="85" y="465" width="265" height="55" rx="10"/><text class="h" x="217" y="500" text-anchor="middle">Cilostazol</text>
  <line class="inhib" x1="217" y1="520" x2="217" y2="542"/><line class="inhib" x1="205" y1="542" x2="229" y2="542"/>
  <rect class="blue" x="85" y="550" width="265" height="72" rx="10"/><text class="h" x="217" y="580" text-anchor="middle">PDE-3</text><text class="s" x="217" y="605" text-anchor="middle" direction="rtl">מפרק cAMP</text>
  <rect class="blue" x="430" y="500" width="245" height="72" rx="10"/><text class="h" x="552" y="532" text-anchor="middle" direction="rtl">עלייה ב-cAMP</text><text class="s" x="552" y="557" text-anchor="middle" direction="rtl">מעכבת הפעלת טסית</text>
  <path class="line" d="M350 492 H552 V495"/>

  <!-- Central activation -->
  <rect class="blue" x="430" y="640" width="330" height="62" rx="10"/><text class="h" x="595" y="678" text-anchor="middle" direction="rtl">הפעלת הטסית</text>
  <path class="line" d="M330 340 V398 H385 V670 H425"/>
  <path class="line" d="M700 340 V398 H760 V670 H765"/>
  <path class="line" d="M840 556 H790 V670 H765"/>
  <line class="inhib" x1="552" y1="572" x2="552" y2="620"/><line class="inhib" x1="540" y1="620" x2="564" y2="620"/>

  <!-- GP IIb/IIIa -->
  <rect class="drug" x="70" y="715" width="300" height="70" rx="10"/><text class="s" x="220" y="745" text-anchor="middle">Abciximab</text><text class="s" x="220" y="770" text-anchor="middle">Eptifibatide · Tirofiban</text>
  <line class="inhib" x1="370" y1="750" x2="410" y2="750"/><line class="inhib" x1="410" y1="738" x2="410" y2="762"/>
  <rect class="blue" x="430" y="720" width="330" height="70" rx="10"/><text class="h" x="595" y="750" text-anchor="middle">GP IIb/IIIa – αIIbβ3</text><text class="s" x="595" y="776" text-anchor="middle" direction="rtl">הפעלת הקולטן על פני הטסית</text>
  <path class="line" d="M595 702 V715"/>
  <rect class="blue" x="430" y="815" width="330" height="58" rx="10"/><text class="h" x="595" y="840" text-anchor="middle" direction="rtl">קישור Fibrinogen</text><text class="s" x="595" y="863" text-anchor="middle" direction="rtl">וגישור בין טסיות</text>
  <path class="line" d="M595 790 V810"/>

  <text class="legend" x="875" y="760" direction="rtl">חץ = הפעלה או התקדמות במסלול</text>
  <text class="legend red" x="875" y="790" direction="rtl">קו המסתיים במחסום = עיכוב</text>
</svg>